<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formularz zaproponowany przez nauczyciela</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #87cefa; font-family: "Times New Roman", Times, serif; color: black; }
    .formularz { position: relative; min-height: 547px; max-width: 1200px; margin: auto; border: 1px solid #333; }
    h1 { position: absolute; top: 1px; left: 31%; right: 1%; margin: 0; text-align: center; font-size: 25px; }
    label, p { font-size: 13px; }
    input, select, textarea, button { font-family: inherit; }
    .dane { position: absolute; top: 97px; left: 1.1%; width: 30%; }
    .wiersz { display: flex; align-items: center; margin-bottom: 13px; }
    .wiersz label { width: 132px; font-weight: bold; flex-shrink: 0; }
    .wiersz input { width: 123px; height: 19px; }
    .programowanie { position: absolute; top: 248px; left: 1.1%; }
    .programowanie p { margin: 10px 0; }
    .programowanie label { display: block; margin: 10px 0; }
    .opinia { position: absolute; top: 375px; left: 1.1%; width: 32%; }
    .opinia label { display: block; font-weight: bold; }
    .opinia textarea { width: 100%; height: 67px; resize: vertical; }
    .transport { position: absolute; left: 42%; top: 116px; width: 27%; text-align: center; }
    .transport h2 { font-size: 18px; color: red; margin: 0 0 16px; }
    .transport select { width: 96px; }
    .dodatkowe { position: absolute; top: 337px; left: 43%; }
    .pole { display: flex; align-items: center; height: 18px; gap: 25px; }
    .pole label { width: 54px; }
    .pole input[type="time"] { width: 64px; height: 19px; }
    .pole input[type="date"] { width: 106px; height: 19px; }
    .pole input[type="color"] { width: 50px; height: 24px; padding: 2px; }
    .ciasto { position: absolute; top: 50px; left: 68%; width: 30%; }
    .ciasto p { margin: 0 0 12px; }
    .ciasto label { display: block; margin: 12px 0; }
    .ciasto .inne-opis { margin-top: 28px; max-width: 290px; }
    .ciasto input[type="text"] { width: 138px; height: 19px; }
    .suwaki { position: absolute; top: 347px; left: 68%; width: 29%; }
    .suwaki label { display: flex; align-items: center; justify-content: space-between; white-space: nowrap; gap: 6px; font-size: 12px; }
    .suwaki input { width: 46%; height: 15px; accent-color: #007aff; }
    .przyciski { position: absolute; bottom: 2px; left: 1.1%; right: 1.1%; height: 62px; }
    button { height: 62px; border: 1px solid #aaa; border-radius: 4px; background: #e9e9ed; font-size: 12px; cursor: pointer; }
    .niespodzianka { position: absolute; left: 0; width: 236px; }
    .reset { position: absolute; left: 42.2%; width: 117px; }
    .wyslij { position: absolute; left: 67.7%; width: 117px; }
    #komunikat { position: absolute; bottom: 67px; left: 42%; font-size: 13px; font-weight: bold; }
    @media (max-width: 700px) {
      .formularz { min-height: 0; padding: 16px; display: flex; flex-direction: column; gap: 25px; }
      h1, .dane, .programowanie, .opinia, .transport, .dodatkowe, .ciasto, .suwaki, .przyciski, #komunikat { position: static; width: 100%; margin: 0; transform: none; text-align: left; }
      h1 { font-size: 24px; text-align: center; }
      .dane .wiersz { margin-bottom: 10px; }
      .opinia textarea { max-width: 360px; }
      .transport h2 { text-align: left; }
      .ciasto .inne-opis { margin-top: 20px; }
      .suwaki { max-width: 320px; }
      .przyciski { flex-wrap: wrap; gap: 10px; }
      .niespodzianka, .reset, .wyslij { width: auto; min-width: 116px; height: 52px; margin: 0; position: static; transform: none; }
    }
  </style>
</head>
<body>
  <form class="formularz" id="formularz">
    <h1>Formularz o................zaproponowany przez nauczyciela</h1>

    <section class="dane" aria-label="Dane osobowe">
      <div class="wiersz"><label for="imie">Imię</label><input id="imie" name="imie" type="text"></div>
      <div class="wiersz"><label for="drugie-imie">Drugie imię</label><input id="drugie-imie" name="drugie_imie" type="text"></div>
      <div class="wiersz"><label for="nazwisko">Nazwisko</label><input id="nazwisko" name="nazwisko" type="text"></div>
      <div class="wiersz"><label for="pseudonim">Pseudonim artystyczny</label><input id="pseudonim" name="pseudonim" type="text"></div>
    </section>

    <section class="programowanie" aria-label="Programowanie">
      <p>Czy umiesz programować?</p>
      <label><input type="radio" name="programowanie" value="Tak"> Tak</label>
      <label><input type="radio" name="programowanie" value="Nie"> Nie</label>
      <label><input type="radio" name="programowanie" value="Nie wiem"> Nie wiem</label>
    </section>

    <section class="opinia">
      <label for="pogoda">W polu poniżej<br>Wpisz opinię na temat pogody</label>
      <textarea id="pogoda" name="opinia_o_pogodzie"></textarea>
    </section>

    <section class="transport">
      <h2>Podaj środek lokomocji<br>dojazdu do pracy</h2>
      <select name="transport" aria-label="Środek lokomocji">
        <option>Autobus</option>
        <option>Samochód</option>
        <option>Rower</option>
        <option>Pociąg</option>
        <option>Tramwaj</option>
        <option>Pieszo</option>
      </select>
    </section>

    <section class="dodatkowe" aria-label="Data, czas i kolor">
      <div class="pole"><label for="czas">podaj czas</label><input id="czas" name="czas" type="time"></div>
      <div class="pole"><label for="data">podaj datę</label><input id="data" name="data" type="date"></div>
      <div class="pole"><label for="kolor">wybierz kolor</label><input id="kolor" name="kolor" type="color" value="#000000"></div>
    </section>

    <section class="ciasto">
      <p>Jaka jest Twoja ulubione ciastko?</p>
      <label><input type="checkbox" name="ciastko" value="BEZA"> BEZA</label>
      <label><input type="checkbox" name="ciastko" value="SERNIK"> SERNIK</label>
      <label><input id="inne" type="checkbox" name="ciastko" value="INNE"> INNE</label>
      <p class="inne-opis">Jeśli zaznaczyłeś INNE to podaj swoje ciastko<br>wpisz ciastko poniżej. Maks: 100 znaków</p>
      <input id="inne-ciastko" name="inne_ciastko" type="text" maxlength="100" aria-label="Inne ulubione ciastko">
    </section>

    <section class="suwaki" aria-label="Suwaki">
      <label for="wilgotnosc">jaka jest wilgotność <input id="wilgotnosc" name="wilgotnosc" type="range" min="0" max="100" value="50"></label>
      <label for="czekaj">Proszę czekać... <input id="czekaj" name="czekaj" type="range" min="0" max="100" value="40"></label>
    </section>

    <output id="komunikat" aria-live="polite"></output>
    <div class="przyciski">
      <button class="niespodzianka" type="button" id="niespodzianka">Przycisk niespodzianka</button>
      <button class="reset" type="reset">Reset</button>
      <button class="wyslij" type="submit">Wyślij zapytanie</button>
    </div>
  </form>
  <script>
    const form = document.getElementById('formularz');
    const komunikat = document.getElementById('komunikat');
    document.getElementById('niespodzianka').addEventListener('click', () => {
      alert('Niespodzianka! Miłego dnia!');
    });
    form.addEventListener('reset', () => { komunikat.textContent = ''; });
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const inne = document.getElementById('inne');
      const ciastko = document.getElementById('inne-ciastko');
      if (inne.checked && !ciastko.value.trim()) {
        komunikat.textContent = 'Podaj nazwę innego ciastka.';
        ciastko.focus();
        return;
      }
      komunikat.textContent = 'Formularz został wypełniony! (Nie wysyła danych do serwera.)';
    });
  </script>
</body>
</html>
